  react-dom: ^19.3.0
  typescript: ^6.0.3
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/node": ^25.9.8
  eslint: ^9.39.4
  prettier: ^3.9.9
  tailwindcss: ^4.3.3
