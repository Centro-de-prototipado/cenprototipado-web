packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  unrs-resolver: true

# Versiones compartidas — un solo punto de verdad para todo el monorepo.
# En cada app/package usa "catalog:" en lugar de la versión literal.
catalog:
  next: 16.4.2
  react: ^19.3.1
  react-dom: ^19.3.1
  typescript: ^6.0.3
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/node": ^25.9.9
  eslint: ^9.39.5
  prettier: ^3.9.10
  tailwindcss: ^4.3.3
