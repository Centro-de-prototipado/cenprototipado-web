name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  metadata:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      dependency-type: ${{ steps.meta.outputs.dependency-type }}
      update-type: ${{ steps.meta.outputs.update-type }}
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

  build-and-merge:
    needs: metadata
    if: >-
      needs.metadata.outputs.dependency-type == 'direct:development' &&
      needs.metadata.outputs.update-type != 'version-update:semver-major'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm -r --if-present test
      - name: Mergear el PR
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebasear los PRs de Dependabot que queden
        run: |
          for pr in $(gh pr list --author 'app/dependabot' --json number --jq '.[].number'); do
            gh pr comment "$pr" --body '@dependabot rebase'
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
